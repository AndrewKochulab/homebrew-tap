name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  # By hand, to build and test every formula in the tap.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    # The formulae here are macOS-only.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: brew test-bot --only-formulae, every formula
        if: github.event_name == 'workflow_dispatch'
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew test-bot --only-formulae --testing-formulae="$(brew tap-info --json "$TAP" | jq -r '.[0].formula_names | join(",")')"
